[tool.poetry]
name = "ilqabad"
version = "0.1.0"
description = "Face Recognition Attendance System for Somali Schools"
authors = ["Amaan <your-email>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.0"
opencv-python = "^4.10"
onnxruntime = "^1.19"
pydantic = "^2.10"
pydantic-settings = "^2.6"
structlog = "^24.4"
httpx = "^0.28"
pillow = "^11.0"
fastapi = "^0.124.0"
uvicorn = "^0.38.0"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
pytest-asyncio = "^0.24"
mypy = "^1.13"
ruff = "^0.8"
pre-commit = "^4.0"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TCH"]
fixable = ["ALL"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
